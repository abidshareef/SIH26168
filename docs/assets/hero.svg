<text x="80" y="198" fill="#64748b" font-family="Arial,sans-serif" font-size="21">SIH 2026 • Problem Statement 26168 • ISRO</text>
<g font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">
