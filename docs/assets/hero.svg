<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">NAV-AION — Intelligent Dead Reckoning</title>
<desc id="desc">NAV-AION uses smartphone sensors, AI motion estimation, GNSS-INS fusion, map constraints and confidence-aware recovery to maintain navigation through GNSS outages.</desc>
<rect width="1400" height="520" rx="28" fill="#0b1220"/>
