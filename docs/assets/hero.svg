<rect x="630" y="285" width="210" height="90" rx="18" fill="#111827" stroke="#475569"/><text x="735" y="325" fill="#e2e8f0">FUSION CORE</text><text x="735" y="353" fill="#94a3b8" font-size="16">INS + error-state</text>
<rect x="910" y="285" width="210" height="90" rx="18" fill="#111827" stroke="#475569"/><text x="1015" y="325" fill="#e2e8f0">MAP + NHC</text><text x="1015" y="353" fill="#94a3b8" font-size="16">Vehicle constraints</text>
<rect x="1190" y="285" width="140" height="90" rx="18" fill="#172554" stroke="#60a5fa"/><text x="1260" y="325" fill="#bfdbfe">LIVE</text><text x="1260" y="353" fill="#93c5fd" font-size="16">POSITION</text>
